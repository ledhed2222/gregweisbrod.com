name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  # Reused rather than duplicated: these are the same workflows the PR checks
  # run. `needs:` only accepts jobs in this file, which is why they are pulled
  # in with workflow_call instead of being depended on across workflows.
  lint:
    uses: ./.github/workflows/lint.yml
  test:
    uses: ./.github/workflows/test.yml

  build_and_deploy:
    name: Deploy
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Display node version
        run: node -v
      - name: Display npm version
        run: npm -v
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GREGWEISBRODSITE }}'
          channelId: live
          projectId: gregweisbrodsite
